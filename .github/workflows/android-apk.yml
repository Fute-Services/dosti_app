# Builds the signed Android tablet APK.
# - Pull requests: typecheck, lint and unit tests.
# - Every push to main (or a manual run from the Actions tab): tests, then builds the
#   release APK and uploads it as the "android-apk" artifact of the run.
# - Push a tag like v1.0.0: same, and the APK is attached to that tag's GitHub Release.
#
# Signing uses these repository secrets (Settings > Secrets and variables > Actions):
#   DOSTI_KEYSTORE_BASE64  base64 of tablet-app/credentials/dosti-release.jks
#   DOSTI_STORE_PASSWORD, DOSTI_KEY_ALIAS, DOSTI_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['windows-app/**']
  pull_request:
    branches: [main]
    paths: ['tablet-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: tablet-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablet-app/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  apk:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablet-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm install --no-audit --no-fund

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOSTI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set, so this APK is signed with the debug key. Add the DOSTI_* secrets to get release-signed APKs."
            exit 0
          fi
          echo "DOSTI_STORE_FILE=dosti-release.jks" >> "$GITHUB_ENV"
          mkdir -p credentials
          echo "$KEYSTORE_BASE64" | base64 -d > credentials/dosti-release.jks

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: tablet-app/android
        env:
          DOSTI_STORE_PASSWORD: ${{ secrets.DOSTI_STORE_PASSWORD }}
          DOSTI_KEY_ALIAS: ${{ secrets.DOSTI_KEY_ALIAS }}
          DOSTI_KEY_PASSWORD: ${{ secrets.DOSTI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          FILE="DostiGreaterThane-${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=tablet-app/$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Dosti Greater Thane $GITHUB_REF_NAME" --notes "Offline sales apps. Android tablet APK below; Windows installers are attached when available."
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" --clobber
